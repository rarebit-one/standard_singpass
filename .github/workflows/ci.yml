name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: rarebit-one/.github/.github/workflows/reusable-gem-ci.yml@v3
    with:
      ruby-versions: '["4.0.1","4.0.2","4.0.3","4.0.4"]'
      # TEMPORARY until this gem moves to Ruby 4.0.9. Hosted ubuntu-latest is
      # now ubuntu-26.04, where setup-ruby builds only the latest patch of each
      # series (4.0.9): every Ruby above fails to install there. ubuntu-24.04
      # still has them all.
      runner-label: ubuntu-24.04
      lint-command: bin/rubocop -f github
      # `extra-lint-commands` is the only place the reusable workflow runs
      # anything beyond `lint-command`. Without it, the brakeman and
      # bundler-audit gates that lefthook enforces on `pre-push` existed
      # only on developer machines — so `main` stayed green while the
      # lockfile accumulated eight advisories. Mirrors standard_ledger
      # and standard_circuit.
      #
      # `--update` refreshes ruby-advisory-db on every run, which means a
      # newly published advisory against an already-locked gem can turn CI
      # red with no code change. That is the intent: for a security gate,
      # learning about a CVE from a red build we didn't cause is strictly
      # better than a stale database quietly passing.
      extra-lint-commands: |
        bundle exec brakeman --no-pager --force
        bundle exec bundler-audit --update
